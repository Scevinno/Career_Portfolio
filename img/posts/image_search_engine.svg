<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A catalogue of shoes in the dark with a search spotlight falling on the few that match">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252a36"/>
      <stop offset="1" stop-color="#121419"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2E86C1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2E86C1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#25dcb8" stop-opacity="0.38"/>
      <stop offset="0.70" stop-color="#25dcb8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#25dcb8" stop-opacity="0"/>
    </radialGradient>

    <g id="s-heel">
      <path d="M14 68 C 20 58 32 52 46 46 C 57 41 66 33 70 23 C 79 29 84 48 80 64 L 63 64 C 49 68 30 72 14 70 Z"/>
      <path d="M77 64 C 80 72 82 80 84 88 L 77 88 C 74 79 70 71 65 64 Z"/>
      <path d="M48 46 C 58 41 67 34 70 25 C 69 39 59 48 50 51 Z" fill="#0d1218" fill-opacity="0.5"/>
      <path d="M13 69 C 30 73 49 69 63 64 L 65 72 C 49 78 30 82 13 78 Z"/>
      <path d="M13 76 C 30 80 49 76 64 70 L 65 73 C 49 79 30 83 13 79 Z" fill="#0d1218" fill-opacity="0.45"/>
    </g>
    <g id="s-boot">
      <path d="M36 14 L 70 14 L 70 66 C 71 74 72 80 73 85 L 17 85 C 11 85 9 77 13 72 C 18 65 28 61 36 58 Z"/>
      <path d="M14 76 C 16 74 20 73 24 73 L 71 73 C 71 77 72 81 73 85 L 17 85 C 12 85 10 80 14 76 Z" fill="#0d1218" fill-opacity="0.45"/>
      <rect x="40" y="26" width="26" height="7" rx="3.5" fill="#0d1218" fill-opacity="0.35"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <g stroke="#eef2f7" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 80H800M0 160H800M0 240H800M0 320H800M0 400H800M0 480H800"/>
    <path d="M80 0V600M160 0V600M240 0V600M320 0V600M400 0V600M480 0V600M560 0V600M640 0V600M720 0V600"/>
  </g>

  <ellipse cx="400" cy="50" rx="560" ry="300" fill="url(#glowB)"/>

  <!-- the catalogue: twenty-four images, none of them described -->
  <g fill="#2b3646">
    <use href="#s-heel" transform="translate(56.35,60.05) scale(0.9)"/>
    <use href="#s-boot" transform="translate(183.1,65.45) scale(0.9)"/>
    <use href="#s-heel" transform="translate(296.35,60.05) scale(0.9)"/>
    <use href="#s-boot" transform="translate(423.1,65.45) scale(0.9)"/>
    <use href="#s-heel" transform="translate(536.35,60.05) scale(0.9)"/>
    <use href="#s-boot" transform="translate(663.1,65.45) scale(0.9)"/>

    <use href="#s-boot" transform="translate(63.1,192.45) scale(0.9)"/>
    <use href="#s-heel" transform="translate(176.35,187.05) scale(0.9)"/>
    <use href="#s-heel" transform="translate(296.35,187.05) scale(0.9)"/>
    <use href="#s-heel" transform="translate(416.35,187.05) scale(0.9)"/>
    <use href="#s-heel" transform="translate(536.35,187.05) scale(0.9)"/>
    <use href="#s-boot" transform="translate(663.1,192.45) scale(0.9)"/>

    <use href="#s-heel" transform="translate(56.35,314.05) scale(0.9)"/>
    <use href="#s-heel" transform="translate(176.35,314.05) scale(0.9)"/>
    <use href="#s-heel" transform="translate(296.35,314.05) scale(0.9)"/>
    <use href="#s-heel" transform="translate(416.35,314.05) scale(0.9)"/>
    <use href="#s-boot" transform="translate(543.1,319.45) scale(0.9)"/>
    <use href="#s-heel" transform="translate(656.35,314.05) scale(0.9)"/>

    <use href="#s-boot" transform="translate(63.1,446.45) scale(0.9)"/>
    <use href="#s-heel" transform="translate(176.35,441.05) scale(0.9)"/>
    <use href="#s-heel" transform="translate(296.35,441.05) scale(0.9)"/>
    <use href="#s-heel" transform="translate(416.35,441.05) scale(0.9)"/>
    <use href="#s-boot" transform="translate(543.1,446.45) scale(0.9)"/>
    <use href="#s-boot" transform="translate(663.1,446.45) scale(0.9)"/>
  </g>

  <!-- the search -->
  <circle cx="400" cy="300" r="166" fill="url(#spot)"/>
  <circle cx="400" cy="300" r="124" fill="none" stroke="#25dcb8" stroke-opacity="0.5" stroke-width="2.5"/>

  <g fill="#25dcb8">
    <use href="#s-heel" transform="translate(296.35,187.05) scale(0.9)"/>
    <use href="#s-heel" transform="translate(416.35,187.05) scale(0.9)"/>
    <use href="#s-heel" transform="translate(296.35,314.05) scale(0.9)"/>
    <use href="#s-heel" transform="translate(416.35,314.05) scale(0.9)"/>
  </g>

</svg>
